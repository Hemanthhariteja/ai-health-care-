<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SOS Emergency">
    <title>SOS Emergency</title>
    <link rel="stylesheet" href="sos-emergency.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <button class="back-btn" onclick="history.back()" aria-label="Go Back">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1 class="page-title">SOS Emergency</h1>
        </header>

        <div class="sos-circle" id="sosCircle">
            <div class="pulse-ring"></div>
            <div class="pulse-ring delay-1"></div>
            <div class="pulse-ring delay-2"></div>
            
            <div class="sos-button">
                <svg class="sos-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="32" y="48" font-size="32" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">SOS</text>
                    <path d="M32 8V18M32 38V42" stroke="white" stroke-width="4" stroke-linecap="round"/>
                </svg>
                <div class="emergency-text">Emergency ➕</div>
            </div>
        </div>

        <p class="help-text">Immediate help</p>

        <div class="confirmation-modal" id="confirmationModal">
            <div class="modal-content">
                <h2 class="modal-title">Are sure want ato trigger an emergency alert?</h2>
                
                <div class="modal-buttons">
                    <button class="modal-btn yes-btn" id="yesBtn">Yes, Call Now</button>
                    <button class="modal-btn cancel-btn" id="cancelBtn">Cancel</button>
                </div>

                <p class="modal-status" id="modalStatus">Emergency services have be notified.</p>

                <svg class="check-animation" id="checkAnimation" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" stroke="#6B9F7F" stroke-width="4" fill="white"/>
                    <path d="M30 50L43 63L70 36" stroke="#6B9F7F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <p class="footer-text">Stay calm. Not hang up.</p>
    </div>

    <script src="sos-emergency.js"></script>
</body>
</html>
