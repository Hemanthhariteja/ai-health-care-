<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Health Reminders">
    <title>Health Reminders</title>
    <link rel="stylesheet" href="health-reminders.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="history.back()" aria-label="Go Back">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1 class="page-title">Health Reminders</h1>
        </header>

        <div class="reminders-list">
            <div class="reminder-card blue-border">
                <div class="reminder-icon blue-icon">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="14" y="10" width="20" height="28" rx="3" stroke="#5D9CAE" stroke-width="2.5"/>
                        <rect x="18" y="16" width="12" height="16" rx="2" fill="#5D9CAE" opacity="0.3"/>
                        <path d="M24 20V28M28 24H20" stroke="#5D9CAE" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="reminder-content">
                    <h2 class="reminder-title">Make your meds</h2>
                    <p class="reminder-time">8:00 AM Daily</p>
                </div>
                <div class="reminder-time-right">
                    <p class="time-text">8:00 AM D</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="reminder-card green-border">
                <div class="reminder-icon green-icon">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12C20 12 16 14 16 18V24C16 28 20 30 24 30C28 30 32 28 32 24V18C32 14 28 12 24 12Z" stroke="#6B9F7F" stroke-width="2.5"/>
                        <path d="M16 24C16 24 18 28 24 28C30 28 32 24 32 24" stroke="#6B9F7F" stroke-width="2.5" stroke-linecap="round"/>
                        <ellipse cx="24" cy="20" rx="8" ry="6" fill="#6B9F7F" opacity="0.2"/>
                    </svg>
                </div>
                <div class="reminder-content">
                    <h2 class="reminder-title">Drink water</h2>
                    <p class="reminder-time">Every 2 hours</p>
                </div>
                <div class="reminder-time-right">
                    <p class="time-text">Every 2 hours</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider green-slider"></span>
                </label>
            </div>

            <div class="reminder-card orange-border">
                <div class="reminder-icon orange-icon">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="16" r="5" stroke="#E8A87C" stroke-width="2.5"/>
                        <path d="M24 21V32M24 32L18 38M24 32L30 38" stroke="#E8A87C" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M14 26L24 22L34 26" stroke="#E8A87C" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="24" cy="24" r="8" fill="#E8A87C" opacity="0.2"/>
                    </svg>
                </div>
                <div class="reminder-content">
                    <h2 class="reminder-title">Exercise stretching</h2>
                    <p class="reminder-time">6:00 PM</p>
                </div>
                <div class="reminder-time-right">
                    <p class="time-text">6:00 PM</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider orange-slider"></span>
                </label>
            </div>

            <div class="reminder-card purple-border">
                <div class="reminder-icon purple-icon">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="12" y="16" width="24" height="22" rx="2" stroke="#9B8FB5" stroke-width="2.5"/>
                        <path d="M18 16V12M30 16V12M12 22H36" stroke="#9B8FB5" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="18" cy="28" r="1.5" fill="#9B8FB5"/>
                        <circle cx="24" cy="28" r="1.5" fill="#9B8FB5"/>
                        <circle cx="30" cy="28" r="1.5" fill="#9B8FB5"/>
                        <circle cx="18" cy="33" r="1.5" fill="#9B8FB5"/>
                    </svg>
                </div>
                <div class="reminder-content">
                    <h2 class="reminder-title">Doctor's visit</h2>
                    <p class="reminder-time">Nov 15, 10:00 AM</p>
                </div>
                <div class="reminder-time-right">
                    <p class="time-text">Nov 15, 10:00 AM</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider purple-slider"></span>
                </label>
            </div>
        </div>

        <button class="add-btn" id="addBtn" aria-label="Add new reminder">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 5V19M5 12H19" stroke="white" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span class="add-btn-text">Reminder</span>
        </button>
    </div>

    <script src="health-reminders.js"></script>
</body>
</html>
