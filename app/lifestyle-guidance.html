<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personalized Lifestyle Guidance">
    <title>Personalized Guidance</title>
    <link rel="stylesheet" href="lifestyle-guidance.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="history.back()" aria-label="Go Back">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1 class="page-title">Personalized Guidance</h1>
            <p class="page-subtitle">Recomentations for a healthier you</p>
        </header>

        <nav class="tabs">
            <button class="tab active" data-category="diet">Diet</button>
            <button class="tab" data-category="exercise">Exercise</button>
            <button class="tab" data-category="yoga">Yoga</button>
            <button class="tab" data-category="daily">Daily Precautions</button>
        </nav>

        <div class="content">
            <div class="category-content active" id="diet-content">
                <div class="cards-grid">
                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="28" r="16" fill="#E8F4E8"/>
                                <circle cx="32" cy="28" r="12" stroke="#6B9F7F" stroke-width="2.5"/>
                                <ellipse cx="28" cy="26" rx="2" ry="3" fill="#6B9F7F"/>
                                <ellipse cx="36" cy="26" rx="2" ry="3" fill="#6B9F7F"/>
                                <path d="M28 32C28 32 30 34 32 34C34 34 36 32 36 32" stroke="#6B9F7F" stroke-width="2" stroke-linecap="round"/>
                                <path d="M32 40L32 48M28 48L36 48" stroke="#6B9F7F" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="card-text">Drink 8 glasses<br>of water daily</p>
                    </div>

                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M32 12C32 12 28 16 24 16C20 16 18 14 18 14C18 14 16 20 16 28C16 36 22 44 32 48C42 44 48 36 48 28C48 20 46 14 46 14C46 14 44 16 40 16C36 16 32 12 32 12Z" fill="#E8F4E8" stroke="#6B9F7F" stroke-width="2.5"/>
                                <path d="M28 28L30 30L36 24" stroke="#6B9F7F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <p class="card-text">Eat 5 servings<br>of veggies</p>
                    </div>

                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <ellipse cx="32" cy="38" rx="14" ry="16" fill="#E8F4E8"/>
                                <path d="M32 22C32 22 28 18 24 18C20 18 18 20 18 24C18 28 20 32 24 36C26 38 28 40 32 42C36 40 38 38 40 36C44 32 46 28 46 24C46 20 44 18 40 18C36 18 32 22 32 22Z" stroke="#6B9F7F" stroke-width="2.5" stroke-linejoin="round"/>
                                <line x1="32" y1="28" x2="32" y2="36" stroke="#6B9F7F" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="card-text">Eat 5 servings<br>fruits & veggies</p>
                    </div>

                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="28" r="14" fill="#FFF4E8"/>
                                <circle cx="32" cy="28" r="10" stroke="#E8A87C" stroke-width="2.5"/>
                                <path d="M32 18V14M32 38V42M22 28H18M42 28H46" stroke="#E8A87C" stroke-width="2.5" stroke-linecap="round"/>
                                <circle cx="32" cy="28" r="4" fill="#E8A87C"/>
                            </svg>
                        </div>
                        <p class="card-text">Reduce<br>prealthy choices</p>
                    </div>

                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <ellipse cx="32" cy="34" rx="12" ry="14" fill="#F0F8F8"/>
                                <path d="M24 28C24 28 26 24 32 24C38 24 40 28 40 28L38 36C38 36 36 40 32 40C28 40 26 36 26 36L24 28Z" stroke="#7AB39D" stroke-width="2.5"/>
                                <path d="M28 30L30 32L34 28" stroke="#7AB39D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M24 28C24 24 26 20 32 20C38 20 40 24 40 28" stroke="#7AB39D" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="card-text">Reduce<br>procesed & sugar</p>
                    </div>

                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="20" y="24" width="24" height="20" rx="2" fill="#F8F0F8" stroke="#9B8FB5" stroke-width="2.5"/>
                                <path d="M26 24V20C26 18 27 16 29 16H35C37 16 38 18 38 20V24" stroke="#9B8FB5" stroke-width="2.5"/>
                                <path d="M28 32H36M28 36H32" stroke="#9B8FB5" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="card-text">Meal prep for<br>choices</p>
                    </div>
                </div>
            </div>

            <div class="category-content" id="exercise-content">
                <div class="cards-grid">
                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="20" r="6" fill="#E8F4E8" stroke="#6B9F7F" stroke-width="2"/>
                                <path d="M32 26V40M32 40L26 46M32 40L38 46" stroke="#6B9F7F" stroke-width="2.5" stroke-linecap="round"/>
                                <path d="M22 32L32 28L42 32" stroke="#6B9F7F" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="card-text">30 min daily<br>exercise</p>
                    </div>
                </div>
            </div>

            <div class="category-content" id="yoga-content">
                <div class="cards-grid">
                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="20" r="5" fill="#F8F0F8" stroke="#9B8FB5" stroke-width="2"/>
                                <path d="M32 25V35M24 28L32 32L40 28M32 35L28 44M32 35L36 44" stroke="#9B8FB5" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="card-text">Morning yoga<br>routine</p>
                    </div>
                </div>
            </div>

            <div class="category-content" id="daily-content">
                <div class="cards-grid">
                    <div class="guidance-card">
                        <div class="card-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="32" r="16" fill="#FFF4E8" stroke="#E8A87C" stroke-width="2.5"/>
                                <path d="M32 20V32L40 36" stroke="#E8A87C" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <p class="card-text">Get 7-8 hours<br>sleep</p>
                    </div>
                </div>
            </div>
        </div>

        <button class="add-btn" id="addBtn" aria-label="Add new guidance">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 5V19M5 12H19" stroke="white" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <script src="lifestyle-guidance.js"></script>
</body>
</html>
