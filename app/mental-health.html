<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mental Health Safe Space">
    <title>Your Safe Space</title>
    <link rel="stylesheet" href="mental-health.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="history.back()" aria-label="Go Back">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1 class="page-title">Your Safe Space</h1>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="message bot-message">
                <div class="avatar bot-avatar">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" fill="#D5D8E8"/>
                        <circle cx="20" cy="18" r="6" fill="#9B8FB5"/>
                        <path d="M10 32C10 26 14 24 20 24C26 24 30 26 30 32" fill="#9B8FB5"/>
                    </svg>
                </div>
                <div class="message-bubble bot-bubble">
                    <p>It's okay to feel this way. I'm here to without judgment.</p>
                </div>
            </div>

            <div class="message user-message">
                <div class="message-bubble user-bubble">
                    <p>I'm feeing really anxieus today.</p>
                </div>
            </div>

            <div class="message bot-message">
                <div class="avatar bot-avatar">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" fill="#D5D8E8"/>
                        <circle cx="20" cy="18" r="6" fill="#9B8FB5"/>
                        <path d="M10 32C10 26 14 24 20 24C26 24 30 26 30 32" fill="#9B8FB5"/>
                    </svg>
                </div>
                <div class="message-bubble bot-bubble">
                    <p>Remember your feelings valid.</p>
                </div>
            </div>

            <div class="message user-message">
                <div class="message-bubble user-bubble">
                    <p>Remember your feelings valid.</p>
                </div>
            </div>

            <div class="message bot-message">
                <div class="avatar bot-avatar">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" fill="#D5D8E8"/>
                        <circle cx="20" cy="18" r="6" fill="#9B8FB5"/>
                        <path d="M10 32C10 26 14 24 20 24C26 24 30 26 30 32" fill="#9B8FB5"/>
                    </svg>
                </div>
                <div class="message-bubble bot-bubble">
                    <p>Your lone to valid.</p>
                </div>
            </div>

            <div class="message user-message">
                <div class="message-bubble user-bubble">
                    <p>I'm member your anxious to led seans.</p>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn anonymous-btn" id="anonymousBtn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C10.9 2 10 2.9 10 4C10 5.1 10.9 6 12 6C13.1 6 14 5.1 14 4C14 2.9 13.1 2 12 2Z" fill="#7A9AA8"/>
                    <path d="M12 8C8.69 8 6 10.69 6 14V18C6 19.1 6.9 20 8 20H10V22H14V20H16C17.1 20 18 19.1 18 18V14C18 10.69 15.31 8 12 8Z" fill="#7A9AA8"/>
                    <circle cx="9" cy="14" r="1.5" fill="white"/>
                    <circle cx="15" cy="14" r="1.5" fill="white"/>
                </svg>
                <span>Anonymous Mode</span>
            </button>
            <button class="action-btn delete-btn" id="deleteBtn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6H5H21" stroke="#E87D5C" stroke-width="2" stroke-linecap="round"/>
                    <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="#E87D5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Delete Conversation</span>
            </button>
        </div>

        <div class="input-container">
            <button class="voice-btn" id="voiceBtn" aria-label="Voice input">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1C10.34 1 9 2.34 9 4V12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12V4C15 2.34 13.66 1 12 1Z" stroke="#7A9AA8" stroke-width="2"/>
                    <path d="M19 10V12C19 15.866 15.866 19 12 19C8.134 19 5 15.866 5 12V10" stroke="#7A9AA8" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 19V23M8 23H16" stroke="#7A9AA8" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <input 
                type="text" 
                class="message-input" 
                id="messageInput" 
                placeholder="Type your message..."
                aria-label="Type your message"
            >
            <button class="send-btn" id="sendBtn" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="mental-health.js"></script>
</body>
</html>
